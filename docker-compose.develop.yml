services:
  users-db-develop:
    image: postgres:16
    container_name: users-db-develop
    environment:
      POSTGRES_DB: usersdb_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yeison
    ports:
      - "5433:5432"
    volumes:
      - usersdb_develop_data:/var/lib/postgresql/data
    networks:
      - develop-net

  turnos-db-develop:
    image: postgres:16
    container_name: turnos-db-develop
    environment:
      POSTGRES_DB: turnosdb_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yeison
    ports:
      - "5434:5432"
    volumes:
      - turnosdb_develop_data:/var/lib/postgresql/data
    networks:
      - develop-net

  notifications-db-develop:
    image: postgres:16
    container_name: notifications-db-develop
    environment:
      POSTGRES_DB: notificationsdb_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yeison
    ports:
      - "5435:5432"
    volumes:
      - notificationsdb_develop_data:/var/lib/postgresql/data
    networks:
      - develop-net

  audit-db-develop:
    image: mongo:7
    container_name: audit-db-develop
    ports:
      - "27017:27017"
    volumes:
      - auditdb_develop_data:/data/db
    networks:
      - develop-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-service-develop:
    build:
      context: ./backend/users-service
      dockerfile: Dockerfile
    container_name: users-service-develop
    depends_on:
      - users-db-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db-develop:5432/usersdb_develop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: yeison
    ports:
      - "8081:8081"
    networks:
      - develop-net

  turnos-service-develop:
    build:
      context: ./backend/turnos-service
      dockerfile: Dockerfile
    container_name: turnos-service-develop
    depends_on:
      - turnos-db-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://turnos-db-develop:5432/turnosdb_develop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: yeison
    ports:
      - "8082:8082"
    networks:
      - develop-net

  notifications-service-develop:
    build:
      context: ./backend/notifications-service
      dockerfile: Dockerfile
    container_name: notifications-service-develop
    depends_on:
      - notifications-db-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATASOURCE_URL: jdbc:postgresql://notifications-db-develop:5432/notificationsdb_develop
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: yeison
    ports:
      - "8083:8083"
    networks:
      - develop-net

  audit-service-develop:
    build:
      context: ./backend/audit-service
      dockerfile: Dockerfile
    container_name: audit-service-develop
    depends_on:
      audit-db-develop:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: develop
      SPRING_DATA_MONGODB_URI: mongodb://audit-db-develop:27017/auditdb_develop
    ports:
      - "8084:8084"
    networks:
      - develop-net
    restart: unless-stopped

  api-gateway-develop:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway-develop
    depends_on:
      - users-service-develop
      - turnos-service-develop
      - notifications-service-develop
      - audit-service-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
    ports:
      - "8080:8080"
    networks:
      - develop-net

  frontend-develop:
    build:
      context: ./frontend/gestion-citas-frontend
      dockerfile: Dockerfile
    container_name: frontend-develop
    depends_on:
      - api-gateway-develop
    ports:
      - "4200:80"
    networks:
      - develop-net
    restart: unless-stopped

volumes:
  usersdb_develop_data:
  turnosdb_develop_data:
  notificationsdb_develop_data:
  auditdb_develop_data:

networks:
  develop-net: