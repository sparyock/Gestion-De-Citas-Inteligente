services:
  users-db-develop:
    image: postgres:16
    container_name: users-db-develop
    environment:
      POSTGRES_DB: usersdb_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - usersdb_develop_data:/var/lib/postgresql/data
    networks:
      - develop-net

  turnos-db-develop:
    image: postgres:16
    container_name: turnos-db-develop
    environment:
      POSTGRES_DB: turnosdb_develop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5434:5432"
    volumes:
      - turnosdb_develop_data:/var/lib/postgresql/data
    networks:
      - develop-net

  users-service-develop:
    build:
      context: ./backend/users-service
    container_name: users-service-develop
    depends_on:
      - users-db-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
    ports:
      - "8081:8081"
    networks:
      - develop-net

  turnos-service-develop:
    build:
      context: ./backend/turnos-service
    container_name: turnos-service-develop
    depends_on:
      - turnos-db-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
    ports:
      - "8082:8082"
    networks:
      - develop-net

  api-gateway-develop:
    build:
      context: ./backend/api-gateway
    container_name: api-gateway-develop
    depends_on:
      - users-service-develop
      - turnos-service-develop
    environment:
      SPRING_PROFILES_ACTIVE: develop
    ports:
      - "8080:8080"
    networks:
      - develop-net

volumes:
  usersdb_develop_data:
  turnosdb_develop_data:

networks:
  develop-net: