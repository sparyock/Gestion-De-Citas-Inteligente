databaseChangeLog:
  - changeSet:
      id: 001-create-notifications-table
      author: yasd
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: id_usuario
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: titulo
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: mensaje
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: tipo
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: leida
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: fecha_creacion
                  type: TIMESTAMP
                  constraints:
                    nullable: false