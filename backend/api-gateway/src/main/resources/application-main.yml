server:
  port: 8280

spring:
  application:
    name: api-gateway-main

  cloud:
    gateway:
      routes:
        - id: users-service
          uri: http://users-service-main:8281
          predicates:
            - Path=/users,/users/**

        - id: turnos-service
          uri: http://turnos-service-main:8282
          predicates:
            - Path=/turnos,/turnos/**

        - id: notifications-service
          uri: http://notifications-service-main:8283
          predicates:
            - Path=/notifications,/notifications/**

        - id: audit-service
          uri: http://audit-service-main:8284
          predicates:
            - Path=/audit,/audit/**

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:4220"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"