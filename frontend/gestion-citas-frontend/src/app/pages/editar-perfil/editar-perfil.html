<div class="editar-perfil-container">
  <div class="card-editar">
    <h1>Editar Perfil</h1>
    <p>Actualiza tu información personal</p>

    <div class="form-group">
      <label>Nombre</label>
      <input type="text" [(ngModel)]="nombre" />
    </div>

    <div class="form-group">
      <label>Correo</label>
      <input type="email" [(ngModel)]="email" />
    </div>

    <div class="form-group">
      <label>Rol</label>
      <input type="text" [value]="rol" disabled />
    </div>

    <div class="form-group">
      <label>Teléfono</label>
      <input type="text" [(ngModel)]="telefono" />
    </div>

    <div class="form-group">
      <label>Fecha de nacimiento</label>
      <input type="date" [(ngModel)]="fechaNacimiento" />
    </div>

    <div class="form-group">
      <label>Documento</label>
      <input type="text" [(ngModel)]="documento" />
    </div>

    <div class="form-group">
      <label>Ciudad</label>
      <input type="text" [(ngModel)]="ciudad" />
    </div>

    <div class="acciones">
      <button class="btn-guardar" (click)="guardarCambios()">Guardar cambios</button>
      <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
</div>
