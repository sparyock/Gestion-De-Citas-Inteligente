<div class="mis-turnos-container">
  <div class="header">
    <div>
      <h1>Mis Turnos</h1>
      <p>Historial completo de citas</p>
    </div>

    <button class="btn-nuevo" (click)="nuevoTurno()">+ Nuevo Turno</button>
  </div>

  <div class="card">
    <h2>Próximos turnos</h2>

    <div *ngIf="cargando">
      Cargando turnos...
    </div>

    <div *ngIf="!cargando && error">
      {{ error }}
    </div>

    <div *ngIf="!cargando && !error && turnos.length === 0">
      No tienes turnos registrados.
    </div>

    <div *ngIf="!cargando && !error && turnos.length > 0">
      <div *ngFor="let turno of turnos" class="turno-item">
        <div>
          <strong>{{ turno.doctor }}</strong><br>
          {{ turno.especialidad }}<br>
          {{ formatearFecha(turno.fechaHora) }}
        </div>

        <div class="acciones-turno">
          <span
            class="estado"
            [ngClass]="{
              'pendiente': esPendiente(turno.estado),
              'cancelado': esCancelado(turno.estado),
              'confirmado': esConfirmado(turno.estado)
            }"
          >
            {{ turno.estado }}
          </span>

          <button
            *ngIf="turno.estado === 'PENDIENTE'"
            (click)="cancelarTurno(turno.idTurno)"
          >
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
