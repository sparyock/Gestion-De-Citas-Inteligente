<div class="auth-container">
  <div class="auth-card">
    <h2>Registro</h2>
    <p>Crea tu cuenta para usar la plataforma</p>

    <form (ngSubmit)="registrarse()">
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nombre"
          required
          placeholder="Tu nombre"
        />
      </div>

      <div class="form-group">
        <label for="email">Correo</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="Crea una contraseña"
        />
      </div>

      <input type="hidden" id="rol" name="rol" [(ngModel)]="rol" />

      <p class="error" *ngIf="error">{{ error }}</p>
      <p *ngIf="mensaje">{{ mensaje }}</p>

      <button type="submit" class="btn-auth">Registrarme</button>
    </form>

    <p class="auth-link">
      ¿Ya tienes cuenta?
      <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</div>
